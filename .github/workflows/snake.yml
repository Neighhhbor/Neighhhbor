name: Refresh contribution snake

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23b3ed8b&color_dots=%23161b22,%231a4747,%23247370,%2344a99e,%2374dfcf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated assets to output branch
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          mkdir -p "$RUNNER_TEMP/snake-assets"
          cp dist/*.svg "$RUNNER_TEMP/snake-assets/"
          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/snake-assets/"*.svg .
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution graph unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution snake"
          git push origin HEAD:output
