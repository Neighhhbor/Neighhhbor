<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Xianjie Shi — building tools for code and agents</title>
  <desc id="desc">A dark terminal with a softly animated network of code, agent, and evaluation nodes. CS at Peking University.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#243442" stroke-width=".7" opacity=".4"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b111a"/><stop offset="1" stop-color="#101e2c"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#65e0da"/><stop offset="1" stop-color="#b3ed8b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#55c9bc" stop-opacity=".15"/><stop offset="1" stop-color="#55c9bc" stop-opacity="0"/></radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 14; animation: flow 7s linear infinite; }
      .cursor { animation: blink 1.4s steps(2, start) infinite; }
      @keyframes pulse { 0%,100% {opacity:.4} 50% {opacity:1} }
      @keyframes flow { to {stroke-dashoffset:-114} }
      @keyframes blink { 50% {opacity:0} }
      @media (prefers-reduced-motion: reduce) { .pulse,.flow,.cursor {animation:none} }
    </style>
  </defs>
  <rect x=".5" y=".5" width="959" height="299" rx="16" fill="url(#bg)" stroke="#2c3d4b"/>
  <rect x="600" y="44" width="335" height="224" fill="url(#grid)"/>
  <ellipse cx="755" cy="165" rx="190" ry="145" fill="url(#glow)"/>
  <path d="M1 43H959" stroke="#263746"/>
  <circle cx="24" cy="23" r="4" fill="#ed6b65"/><circle cx="40" cy="23" r="4" fill="#e9bc60"/><circle cx="56" cy="23" r="4" fill="#88c97e"/>
  <text x="78" y="27" class="mono" font-size="11" fill="#91a3b6">neighhhbor / workbench</text>
  <text x="925" y="27" text-anchor="end" class="mono" font-size="10" fill="#678396">~/build/ideas</text>
  <text x="38" y="85" class="mono" font-size="12" fill="#74dfcf">$ whoami</text>
  <text x="36" y="139" class="sans" font-size="46" font-weight="650" letter-spacing="-1.5" fill="#eaf2f7">Xianjie Shi<tspan fill="#b3ed8b">.</tspan></text>
  <text x="39" y="174" class="mono" font-size="15" fill="#afc2d2">Building tools for code and agents.</text>
  <text x="39" y="208" class="mono" font-size="12" fill="#7995a9">CS @ Peking University</text>
  <text x="39" y="264" class="mono" font-size="11" fill="#65e0da">understand<tspan fill="#567183"> → </tspan>build<tspan fill="#567183"> → </tspan>evaluate<tspan fill="#567183"> → </tspan>iterate</text>
  <rect x="352" y="254" width="7" height="13" fill="#b3ed8b" class="cursor"/>
  <g fill="none" stroke="#3f6c70" stroke-width="1.4">
    <path d="M654 106L766 155L876 103M654 106L675 239L766 155L865 235L876 103M675 239L865 235"/>
    <path d="M654 106L766 155L865 235M675 239L766 155L876 103" stroke="url(#line)" class="flow"/>
  </g>
  <g class="mono" text-anchor="middle">
    <rect x="615" y="89" width="78" height="34" rx="9" fill="#112532" stroke="#427578"/>
    <text x="654" y="111" font-size="12" fill="#8cdbd6">code</text>
    <rect x="835" y="86" width="82" height="34" rx="9" fill="#112532" stroke="#427578"/>
    <text x="876" y="108" font-size="12" fill="#8cdbd6">context</text>
    <circle cx="766" cy="155" r="36" fill="#142c34" stroke="#72d9c8" stroke-width="1.6"/>
    <circle cx="766" cy="155" r="44" fill="none" stroke="#72d9c8" stroke-width=".8" class="pulse"/>
    <text x="766" y="159" font-size="12" fill="#d0f3dd">agent</text>
    <rect x="635" y="222" width="80" height="34" rx="9" fill="#112532" stroke="#427578"/>
    <text x="675" y="244" font-size="12" fill="#8cdbd6">tools</text>
    <rect x="824" y="218" width="82" height="34" rx="9" fill="#172b30" stroke="#6e9167"/>
    <text x="865" y="240" font-size="12" fill="#b3ed8b">evals</text>
  </g>
</svg>
